<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frag List</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6573;
    --line: #e3e6eb; --accent: #b4232c; --chip: #f1e3e4; --link: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaee; --muted: #9aa3b2;
      --line: #262a33; --accent: #ff6b72; --chip: #3a2226; --link: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; min-width: 120px;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  a { color: var(--link); font-weight: 600; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .when b { display: block; }
  .when span, .killers { color: var(--muted); font-size: 13px; }
  .pos {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    background: var(--chip); color: var(--accent); font-weight: 600; font-size: 13px;
  }
  .empty, .error { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    tr:last-child { border-bottom: 0; }
    td { border: 0; padding: 3px 12px; }
    td[data-label]::before {
      content: attr(data-label); display: inline-block; min-width: 92px;
      color: var(--muted); font-size: 13px;
    }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Frag List</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>
<script>
  // Always read the latest data straight from the repo, so this page never
  // needs to be rebuilt when the tracker pushes a new frags.json.
  const DATA_URL = "https://raw.githubusercontent.com/Ruslex1234/tibia-target-exp-tracker/main/frags.json";

  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", year: "numeric", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", timeZoneName: "short",
  });
  const rel = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });

  function ago(seconds) {
    const diff = seconds - Date.now() / 1000;
    const units = [["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [unit, size] of units) {
      if (Math.abs(diff) >= size) return rel.format(Math.round(diff / size), unit);
    }
    return "just now";
  }

  function toUnix(d) {
    return d.time_unix || Math.floor(Date.parse(d.time) / 1000);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function charLink(name) {
    const url = "https://www.tibia.com/community/?subtopic=characters&name=" + encodeURIComponent(name);
    return `<a href="${url}" target="_blank" rel="noopener">${esc(name)}</a>`;
  }

  async function load() {
    const sub = document.getElementById("sub");
    try {
      const res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const deaths = data.deaths || [];

      document.getElementById("title").textContent = `${data.killer} frags on ${data.world}`;
      const updated = Math.floor(Date.parse(data.updated_at) / 1000);
      sub.textContent = `Last 30 days, 1st or 2nd killer only. Updated ${ago(updated)}. Times shown in your timezone (${zone}).`;

      const now = Date.now() / 1000;
      const within = s => deaths.filter(d => now - toUnix(d) <= s).length;
      document.getElementById("stats").innerHTML = [
        [within(86400), "last 24 hours"], [within(7 * 86400), "last 7 days"], [deaths.length, "last 30 days"],
      ].map(([n, label]) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`).join("");

      const list = document.getElementById("list");
      if (!deaths.length) {
        list.innerHTML = `<div class="empty">No qualifying deaths in the last 30 days.</div>`;
        return;
      }
      list.innerHTML = `<table>
        <thead><tr><th>When</th><th>Victim</th><th>Level</th><th>Position</th><th>All killers</th></tr></thead>
        <tbody>${deaths.map(d => {
          const t = toUnix(d);
          return `<tr>
            <td class="when"><b>${esc(fmt.format(new Date(t * 1000)))}</b><span>${esc(ago(t))}</span></td>
            <td data-label="Victim">${charLink(d.victim)}</td>
            <td data-label="Level">${esc(d.victim_level)}</td>
            <td data-label="Position"><span class="pos">#${esc(d.position)}</span></td>
            <td data-label="All killers" class="killers">${(d.killers || []).map(esc).join(", ")}</td>
          </tr>`;
        }).join("")}</tbody></table>`;
    } catch (e) {
      sub.textContent = "";
      document.getElementById("list").innerHTML = `<div class="error">Could not load the frag list (${esc(e.message)}).</div>`;
    }
  }
  load();
</script>
</body>
</html>
