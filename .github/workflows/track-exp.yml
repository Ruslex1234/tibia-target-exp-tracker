name: Track Tibia Experience

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

# Never let two runs overlap and race each other on the exp.json push
concurrency:
  group: track-exp
  cancel-in-progress: false

jobs:
  track-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # No setup or install steps: the script uses only the Python standard
      # library, and ubuntu-latest already ships python3.
      - name: Run experience tracker
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          WEBHOOK_TROLL: ${{ secrets.WEBHOOK_TROLL }}
        run: |
          python3 track_exp.py

      - name: Commit and push exp data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if either data file changed (status also catches a new untracked file)
          if [ -z "$(git status --porcelain -- exp.json trolls_exp.json)" ]; then
            echo "No changes to exp data"
          else
            for f in exp.json trolls_exp.json; do
              if [ -e "$f" ]; then git add -- "$f"; fi
            done
            git commit -m "Update experience data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
