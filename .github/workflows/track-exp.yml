name: Track Tibia Experience

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  track-exp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run experience tracker
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
        run: |
          python track_exp.py

      - name: Commit and push exp.json updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if exp.json has changes
          if git diff --quiet exp.json; then
            echo "No changes to exp.json"
          else
            git add exp.json
            git commit -m "Update experience data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
